<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行記録</title>

  <style>
    /* 全体 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 100px;
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #f5f5f5;
    }

    /* header */
    header {
      padding: 24px;
      text-align: center;
      color: #333333;
      background-color: #D9E5FF;
    }

    header h1 {
      margin: 0;
    }

    /* main */
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: #777777;
    }

    section {
      margin-bottom: 24px;
      padding: 24px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    section h2 {
      margin-top: 0;
      color: #2c3e50;
    }

    /* footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      text-align: center;
      color: #333333;
      background-color: #D9E5FF;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      margin: 0 8px;
      color: #333333;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>旅行記録</h1>
  </header>

  <main>
    <section>
      <h2>サイト紹介</h2>
      <p>
        様々な旅行の記録を残すWebサイトです。
        食べ物、おすすめスポットなどを掲載します。
      </p>
    </section>

    <section>
      <h2>目的</h2>
      <p>
        誰かの旅の参考になることを目的に作成したサイトです。
        詳しい内容についてはお気軽にお問い合わせください。
      </p>
      <img src="画像のリンク" alt="サンプル">
    </section>
  </main>

  <footer>
    <p>お問い合わせ：info@example.com</p>

    <p>
      <a href="#">X</a>
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
    </p>
  </footer>

</body>
</html>
